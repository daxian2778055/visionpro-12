name: CI

on:
  push:
  pull_request:

jobs:
  # 单元测试：WindowsFormsApplication1.Tests 采用"源码链接"设计（Compile Include 直链主工程源文件，
  # 不引用主工程程序集），因此不依赖 Cognex VisionPro（主工程的绝对路径 HintPath 在托管 runner 上不存在）
  # 即可真实编译并运行 165 个用例（★第56轮：+38 例——DisplayThrottleWeightTests 19 例钉阈值保护带
  # 与权重主动降幅（低于阈值一帧不丢且对照第54轮确实被压、保护带零和、W=100 时 80Hz 显示 40Hz、
  # 降幅随频率单调、阈值/权重同时为 0 逐帧等价第54轮回退基线、脏参数回默认、迟滞、需求估计跳变与断流复采）
  # + RenderCostMeterTests 11 例钉耗时读数口径（只读上一完整窗、无样本回 0、换窗先快照后入账故边界笔归新窗、
  # now=0 与"未起始"哨兵同值、跨 TickCount 回绕照样换窗、脏窗口参数回退 1000ms、并发不吞样本）
  # + RenderTailFrameTests 8 例钉停止态末帧一次性旁路（运行态一帧都不补、每路每次停止只一帧、
  # 本来要显示的帧不消耗额度、旁路不挪任何人的到期表、各路额度独立、非法槽位拒绝、补显那帧要进显示账）。
  # 注：封顶是解析式的，**实测放行帧数**只在启动/换模式的估计期一次性临时超出（无周期样本的路不预约额度），
  # 所以"不越封顶"的断言一律按稳态窗口（起点 ≥ 普查窗口 2000ms）写，数字见用例注释；
  # ★第55轮：+3 例——连续运行不计件边界的判定（含 \0/空白变体、
  # 边界只排除连续运行不得顺手改白名单、模式归一化先去零字节再 Trim）；
  # ★第54轮：+13 例——显示渲染预算的按需求解分摊（旧口径对照必须饿死路、
  # 低频路一帧不丢、闲置份额让给高频路、总放行量封顶、任意启动时刻下 TickCount 回绕自洽）；
  # ★第53轮：+11 例——帧账本的诚实口径（三组分类完备、漏帧对账四种结论、
  # 备注类不得混进丢帧明细）；★第51.9轮：+2 例——反射元数据禁止下钻（实测真因：元数据链吃光 50000 节点预算、第 2 路 job 根本没走到）；
  # ★第51.8轮：+2 例——三个预算常量按现场实测校准、深度截断留痕必须带路径；
  # ★第51.7轮：+9 例节点级沉默记账/守卫扩项；跑数一律取本机
  # dotnet test 实测，不手推——51.2 起按"用例数随实测同步"的口径）。
  # 注：含 E:\ 统计根目录的端到端用例在无 E 盘的 runner 上会自动 Inconclusive 跳过，本机 verify.ps1 覆盖。
  # 主工程本身（WinExe + Cognex 引用）只能在装有 VisionPro 的开发机编译：本机跑 verify.ps1。
  unit-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Run unit tests
        run: dotnet test WindowsFormsApplication1.Tests\WindowsFormsApplication1.Tests.csproj -c Release --nologo
