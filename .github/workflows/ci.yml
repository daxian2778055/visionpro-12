name: CI

on:
  push:
  pull_request:

jobs:
  # 单元测试：WindowsFormsApplication1.Tests 采用"源码链接"设计（Compile Include 直链主工程源文件，
  # 不引用主工程程序集），因此不依赖 Cognex VisionPro（主工程的绝对路径 HintPath 在托管 runner 上不存在）
  # 即可真实编译并运行 124 个用例（★第54轮：+13 例——显示渲染预算的按需求解分摊（旧口径对照必须饿死路、
  # 低频路一帧不丢、闲置份额让给高频路、总放行量封顶、任意启动时刻下 TickCount 回绕自洽）；
  # ★第53轮：+11 例——帧账本的诚实口径（三组分类完备、漏帧对账四种结论、
  # 备注类不得混进丢帧明细）；★第51.9轮：+2 例——反射元数据禁止下钻（实测真因：元数据链吃光 50000 节点预算、第 2 路 job 根本没走到）；
  # ★第51.8轮：+2 例——三个预算常量按现场实测校准、深度截断留痕必须带路径；
  # ★第51.7轮：+9 例节点级沉默记账/守卫扩项；跑数一律取本机
  # dotnet test 实测，不手推——51.2 起按"用例数随实测同步"的口径）。
  # 注：含 E:\ 统计根目录的端到端用例在无 E 盘的 runner 上会自动 Inconclusive 跳过，本机 verify.ps1 覆盖。
  # 主工程本身（WinExe + Cognex 引用）只能在装有 VisionPro 的开发机编译：本机跑 verify.ps1。
  unit-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Run unit tests
        run: dotnet test WindowsFormsApplication1.Tests\WindowsFormsApplication1.Tests.csproj -c Release --nologo
